# The Sulcus Relay: a small program people run on their own PC or server so
# their devices and friends can reach each other.
[package]
name = "sulcus-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
sulcus-net = { path = "../sulcus-net" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
# The phone bridge's HTTPS side.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# Let's Encrypt certificates for the phone bridge (`--acme`).
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = "0.13"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
