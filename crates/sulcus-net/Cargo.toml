# SulcusAI's peer-to-peer network layer, without Tauri, so the app and the
# Sulcus Relay program share one copy of it.
[package]
name = "sulcus-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

# Path dependency of the app with a lockfile of its own; never folded into a
# workspace above it.
[workspace]

[features]
# Signing with a throwaway key, for tests of code that checks signatures.
# Nothing that can sign ships in the app.
dev-sign = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Pinned exactly: libp2p breaks its API a few times a year, and this crate is
# the one place an upgrade should touch.
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "identify", "ping", "macros", "ed25519", "mdns", "upnp", "autonat", "relay", "dcutr", "kad"] }
# Not re-exported by the libp2p facade.
libp2p-stream = "=0.5.0-alpha"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures = "0.3"
# Already in the lockfile through libp2p: invite secrets are kept hashed,
# and made from the OS random source.
sha2 = "0.10"
getrandom = "0.2"
# Letters sealed end to end (seal.rs); both already in the lockfile.
ring = "0.17"
x25519-dalek = "=3.0.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
