# A throwaway check of rust-libp2p's Circuit Relay v2 and DCUtR before the
# phase 5 network layer is built. Not part of the app's build.
[package]
name = "sulcus-relay-spike"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Its own workspace, so cargo never folds it into anything above it.
[workspace]

[dependencies]
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "relay", "dcutr", "identify", "ping", "macros", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
# Not re-exported by the libp2p facade.
libp2p-stream = "0.5.0-alpha"

# The same settings as the app's release build, so the size compares.
[profile.release]
lto = "thin"
strip = true
