# SulcusAI sync relay on Cloudflare Workers (free plan is enough).
#   npx wrangler deploy        → https://sulcusai-relay.<your-subdomain>.workers.dev
# Then in SulcusAI: Settings → Your devices → Sync when away from home.
name = "sulcusai-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "BOX"
class_name = "Box"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Box"]
