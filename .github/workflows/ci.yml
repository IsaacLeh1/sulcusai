name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: UI type check, tests and build
        run: |
          pnpm build
          pnpm test
      - name: npm license policy
        run: pnpm check:licenses
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      # cargo-deny-action runs in a container, which Windows runners can't.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Rust license policy
        working-directory: src-tauri
        run: cargo deny check licenses

  # macOS and Linux: the core builds and its tests pass there too.
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev libxdo-dev pkg-config
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
