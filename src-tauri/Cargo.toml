[package]
name = "sulcusai"
version = "0.1.0"
description = "Private, on-device AI workspace"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sulcusai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# rustls keeps TLS identical on every OS and avoids OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Security",
] }

# Hash checks of multi-GB files are painfully slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
