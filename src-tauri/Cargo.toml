[package]
name = "sulcusai"
version = "0.7.1"
description = "Private, on-device AI workspace"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.88"

[lib]
name = "sulcusai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# rustls keeps TLS identical on every OS and avoids OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Engine downloads for Linux and macOS come as .tar.gz.
flate2 = "1"
tar = "0.4"
# Encryption at rest: AES-256-GCM fields, Argon2id PIN keys.
aes-gcm = "0.10"
# Sync between the user's PCs: pairing by code (SPAKE2), session keys.
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
# The phone page: requests sealed like TweetNaCl's secretbox; QR codes to add a phone.
crypto_secretbox = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
# Agent tools: diffs for edit previews, .gitignore-aware search, path checks.
similar = "2"
ignore = "0.4"
regex = "1"
dunce = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
# Signed updates from the project's GitHub Releases.
tauri-plugin-updater = "2"
# Neural voices and speaker labels: ONNX Runtime, loaded at run time from a
# downloaded, hash-checked copy (nothing is bundled or fetched at build time).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17"] }
unicode-normalization = "0.1"
# Readable text from web pages.
html2text = "0.17"
# Email (IMAP read, SMTP send) and calendars (CalDAV).
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
quick-xml = "0.38"
chrono-tz = "0.10"
# Documents: Word (write), Excel (write with formulas and charts; read), PDF (read).
docx-rs = "0.4"
rust_xlsxwriter = { version = "0.99", default-features = false }
calamine = "0.36"
pdf-extract = "0.12"
# The opt-in local API server (OpenAI-compatible, 127.0.0.1 only).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Pictures: sizes, masks, thumbnails, cut-outs and screenshots.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
# The built-in browser's in-process DevTools channel (same version as wry's).
webview2-com = "0.39"
windows = { version = "0.58", features = [
  "Devices_Geolocation",
  "Foundation",
  "Foundation_Collections",
  "Media_SpeechSynthesis",
  "Security_Credentials_UI",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

# Hash checks of multi-GB files and Argon2 PIN checks are painfully slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true

# macOS and Linux: the system keychain protects the data key (DPAPI's role on Windows).
[target.'cfg(not(windows))'.dependencies]
# Deleting moves things to the Trash (freedesktop trash on Linux), so it can be undone.
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
