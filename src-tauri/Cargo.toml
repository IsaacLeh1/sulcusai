[package]
name = "sulcusai"
version = "0.1.0"
description = "Private, on-device AI workspace"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.88"

[lib]
name = "sulcusai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# rustls keeps TLS identical on every OS and avoids OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Encryption at rest: AES-256-GCM fields, Argon2id PIN keys.
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
# Agent tools: diffs for edit previews, .gitignore-aware search, path checks.
similar = "2"
ignore = "0.4"
regex = "1"
dunce = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Neural voices and speaker labels: ONNX Runtime, loaded at run time from a
# downloaded, hash-checked copy (nothing is bundled or fetched at build time).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17"] }
unicode-normalization = "0.1"
# Readable text from web pages.
html2text = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_SpeechSynthesis",
  "Security_Credentials_UI",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

# Hash checks of multi-GB files and Argon2 PIN checks are painfully slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
