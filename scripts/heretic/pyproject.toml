[project]
name = "heretic-uncensor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1+cu128",
    "heretic-llm==1.4.0",
    # llama.cpp's GGUF converter (in llama-convert/), for models whose
    # tokenizer is SentencePiece's.
    "sentencepiece",
    "protobuf",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
