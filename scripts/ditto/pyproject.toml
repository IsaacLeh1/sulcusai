[project]
name = "ditto-talking"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1+cu128",
    "einops",
    "numpy",
    "opencv-python-headless",
    "librosa",
    "scipy",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
    "filetype",
    "mediapipe",
    "onnxruntime",
    "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
